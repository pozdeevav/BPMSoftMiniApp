<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BPMSoft Mini App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            transition: transform 0.2s ease;
        }

        .container:hover {
            transform: scale(1.02);
        }

        .main-text {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            background: #e9ecef;
            color: #2c3e66;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-text">BPMSoft Mini App</div>
        <div class="badge">⚡ Работает в MAX</div>
    </div>

    <!-- Подключение MAX Bridge (опционально, но рекомендуется для мини-приложений) -->
    <script src="https://cdn.jsdelivr.net/npm/@max/max-web-app@latest/dist/max-web-app.js">
    </script>
    <script>
        // Отправка сообщения при загрузке приложения через MAX Bridge
        (function() {
            if (window.WebApp) {
                console.log('MAX Bridge подключён. Приложение готово.');

                // 1. Уведомляем платформу, что приложение полностью загружено
                if (typeof window.WebApp.ready === 'function') {
                    window.WebApp.ready();
                }

                // 2. Отправляем пользовательское сообщение (если поддерживается)
                var message = 'Приложение BPMSoft загружено и готово к работе';

                if (typeof window.WebApp.sendMessage === 'function') {
                    window.WebApp.sendMessage(message);
                    console.log('Сообщение отправлено через sendMessage:', message);
                } else if (typeof window.WebApp.sendData === 'function') {
                    window.WebApp.sendData({
                        type: 'loaded',
                        text: message,
                        timestamp: Date.now()
                    });
                    console.log('Сообщение отправлено через sendData:', message);
                } else {
                    console.log('Метод отправки сообщения не найден, но приложение готово.');
                }
            } else {
                console.log('Работа вне среды MAX (локальный просмотр)');
            }
        })();
    </script>
</body>
</html>
