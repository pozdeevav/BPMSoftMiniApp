<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BPMSoft Mini App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            transition: transform 0.2s ease;
            max-width: 400px;
            width: 100%;
        }

        .container:hover {
            transform: scale(1.02);
        }

        .main-text {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 16px;
        }

        .badge {
            display: inline-block;
            background: #e9ecef;
            color: #2c3e66;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .close-btn {
            background: #dc3545;
            color: #fff;
            border: none;
            border-radius: 40px;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3);
        }

        .close-btn:hover {
            background: #c82333;
            transform: scale(1.03);
        }

        .close-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-text">BPMSoft Mini App</div>
        <div class="badge">⚡ Работает в MAX</div>
        <button class="close-btn" id="closeAppBtn">Закрыть приложение</button>
    </div>

    <!-- Подключение MAX Bridge -->
    <script src="https://cdn.jsdelivr.net/npm/@max/max-web-app@latest/dist/max-web-app.js">
    </script>
    <script>
        (function() {
            // Функция отправки сообщения в MAX
            function sendMessageToMax(text) {
                if (!window.WebApp) {
                    console.log('MAX Bridge не доступен, сообщение не отправлено:', text);
                    return false;
                }

                // Попытка отправить через sendMessage
                if (typeof window.WebApp.sendMessage === 'function') {
                    window.WebApp.sendMessage(text);
                    console.log('Сообщение отправлено (sendMessage):', text);
                    return true;
                }

                // Альтернативный способ через sendData
                if (typeof window.WebApp.sendData === 'function') {
                    window.WebApp.sendData({
                        type: 'close',
                        text: text,
                        timestamp: Date.now()
                    });
                    console.log('Сообщение отправлено (sendData):', text);
                    return true;
                }

                console.warn('Метод отправки сообщения не найден');
                return false;
            }

            // Функция закрытия приложения
            function closeApp() {
                // Отправляем сообщение о закрытии
                const closeMessage = 'Приложение BPMSoft закрывается пользователем';
                sendMessageToMax(closeMessage);

                // Закрываем приложение через Bridge
                if (window.WebApp && typeof window.WebApp.close === 'function') {
                    window.WebApp.close();
                } else {
                    // Если close недоступен — показываем alert (для тестов вне MAX)
                    alert('Приложение закрыто (имитация, т.к. close() не доступен)');
                    console.warn('WebApp.close() не найден');
                }
            }

            // Навешиваем обработчик на кнопку
            const btn = document.getElementById('closeAppBtn');
            if (btn) {
                btn.addEventListener('click', closeApp);
            }

            // При загрузке отправляем сообщение о готовности
            if (window.WebApp) {
                console.log('MAX Bridge подключён. Приложение готово.');

                if (typeof window.WebApp.ready === 'function') {
                    window.WebApp.ready();
                }

                // Отправляем стартовое сообщение
                sendMessageToMax('Приложение BPMSoft загружено и готово к работе');
            } else {
                console.log('Работа вне среды MAX (локальный просмотр)');
            }
        })();
    </script>
</body>
</html>
