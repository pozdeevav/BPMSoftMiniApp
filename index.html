<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BPMSoft Mini App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            max-width: 400px;
            width: 100%;
            transition: transform 0.2s ease;
        }

        .container:hover {
            transform: scale(1.02);
        }

        .main-text {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            background: #e9ecef;
            color: #2c3e66;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .input-group {
            margin: 20px 0 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .input-group input {
            padding: 12px 16px;
            border: 2px solid #d1d9e6;
            border-radius: 40px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            background: #f8faff;
            width: 100%;
        }

        .input-group input:focus {
            border-color: #2a5298;
        }

        .btn {
            border: none;
            border-radius: 40px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            width: 100%;
        }

        .btn-primary {
            background: #2a5298;
            color: #fff;
            box-shadow: 0 4px 10px rgba(42, 82, 152, 0.3);
        }
        .btn-primary:hover {
            background: #1e3c72;
            transform: scale(1.02);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-danger {
            background: #dc3545;
            color: #fff;
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.3);
            margin-top: 12px;
        }
        .btn-danger:hover {
            background: #c82333;
            transform: scale(1.02);
        }
        .btn-danger:active {
            transform: scale(0.97);
        }

        .status {
            margin-top: 16px;
            font-size: 0.9rem;
            color: #2c3e66;
            word-break: break-word;
            min-height: 1.5em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-text">BPMSoft Mini App (demo)</div>
        <div class="badge">⚡ Работает в MAX</div>

        <!-- Поле ввода и кнопка отправки -->
        <div class="input-group">
            <input type="text" id="messageInput" placeholder="Введите сообщение..." />
            <button class="btn btn-primary" id="sendBtn">📨 Отправить</button>
        </div>

        <!-- Статус -->
        <div class="status" id="statusMessage">Готово</div>
    </div>

    <!-- Подключение MAX Bridge (официальный CDN) -->
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <script>
        (async function() {
            const inputField = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const closeBtn = document.getElementById('closeBtn');
            const statusEl = document.getElementById('statusMessage');

            // Функция для обновления статуса
            function setStatus(text, isError = false) {
                statusEl.textContent = text;
                statusEl.style.color = isError ? '#dc3545' : '#2c3e66';
                console.log('[Статус]', text);
            }

            // ---------- Проверка MAX Bridge ----------
            const webApp = window.WebApp;

            if (webApp) {
                console.log('✅ MAX Bridge подключён. Версия:', webApp.version || 'неизвестна');
                setStatus('Bridge загружен');

                // Получаем данные пользователя (если есть)
                let userId = null;
                if (webApp.initDataUnsafe && webApp.initDataUnsafe.user) {
                    userId = webApp.initDataUnsafe.user.id;
                    console.log('ID пользователя:', userId);
                }

                // Можно отправить сообщение о запуске (но токен должен быть безопасно передан)
                // Для демонстрации просто логируем
                // ВАЖНО: токен для API должен храниться на сервере!
                // Здесь мы не будем делать реальный запрос, т.к. нет токена.
                // Покажем только пример.
                if (userId) {
                    setStatus(`Пользователь: ${webApp.initDataUnsafe.user.first_name || 'Аноним'}`);
                } else {
                    setStatus('Нет данных пользователя');
                }
            } else {
                console.warn('⚠️ MAX Bridge не найден. Приложение работает вне MAX.');
                setStatus('⚠️ Демо-режим (вне MAX)', true);
            }

            // ---------- Обработчик кнопки "Отправить" ----------
            function handleSend() {
                // Получаем введённое значение
                const message = inputField.value.trim();

                if (!message) {
                    setStatus('⚠️ Введите текст перед отправкой', true);
                    return;
                }

                // Выводим в консоль (можно заменить на реальную отправку)
                console.log('📤 Отправлено сообщение:', message);
                setStatus(`✅ Сообщение отправлено: "${message}"`);

                // ----- Пример реальной отправки (закомментировано) -----
                // Если у вас есть токен и user_id, можно раскомментировать:
                
                const userId = webApp?.initDataUnsafe?.user?.id;
                if (userId && message) {
                    fetch(`https://occ-con-c-005.bpmrnd.ru/BPMSoftOCCHook/max/DAF93A72-031C-438A-A596-06CF72AC26C4/1EEB7159-78DE-4E79-9614-71B7C267B2DF/miniapp`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            hook: {
                                update_type: "mini_app_open",
                                timestamp: new Date(),
                                message: {
                                    sender: {
                                        user_id: webApp.user?.id,
                                        first_name: webApp.user?.first_name,
                                        last_name: webApp.user?.last_name,
                                        name: webApp.user?.name,
                                        username: webApp.user?.username,
                                        is_bot: false,
                                        last_activity_time: webApp.user?.last_activity_time
                                    },
                                    recipient: {
                                        chat_id: webApp.chat?.id,
                                        chat_type: webApp.chat?.type,
                                        user_id: webApp.user?.id
                                    },
                                    timestamp: new Date(),
                                    link: null,
                                    stat: null,
                                    url: null
                                },
                                user_locale: "ru"
                            }
                        })
                    })
                    .then(res => res.json())
                    .then(data => setStatus('✅ Отправлено через API'))
                    .catch(err => setStatus('❌ Ошибка отправки: ' + err.message, true));
                } else {
                    setStatus('❌ Нет user_id или токена', true);
                }

                // Очищаем поле после отправки (опционально)
                inputField.value = '';
            }

            // Навешиваем обработчик на кнопку
            sendBtn.addEventListener('click', handleSend);

            // Также можно отправлять по нажатию Enter
            inputField.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    handleSend();
                }
            });
        })();
    </script>
</body>
</html>
